<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Inscript d'un client</legend>
        <table>
            <tr>
                <td><label for="">Nom</label></td>
                <td><input type="text" name="" id="n"></td>
            </tr>
            <tr>
                <td><label for="">prenom</label></td>
                <td><input type="text" name="" id="p"></td>
            </tr>
            <tr>
                <td><label for="">tel</label></td>
                <td><input type="text" name="" id="tel"></td>
            </tr>
            <tr>
                <td><label for="">adresse</label></td>
                <td><textarea name="" id="addr"></textarea></td>
            </tr>
        </table>
    </fieldset>
    <fieldset>
        <table>
            <tr>
                <td><label for="">Mot de passe</label></td>
                <td><input type="password" name="" id="pass"></td>
            </tr>
            <tr>
                <td><label for="">Confirmation de mot de passe</label></td>
                <td><input type="password" name="" id="repass"></td>
            </tr>
        </table>
        <button type="submit" onclick="valider()">valider</button>
        <button type="reset">annuler</button>
    </fieldset>
    <script src="script.js"></script>
</body>
</html>
