<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Document</title>
</head>
<body>
    <div id="calculator">
        <h3 id="natija"></h3>
        <div id="numbers">
            <table>
                <tr>
                    <td><button type="submit" class="bu1" id="one" onclick="appendtd('1')">1</button></td>
                    <td><button type="submit" class="bu1" id="two" onclick="appendtd('2')">2</button></td>
                    <td><button type="submit" class="bu1" id="three" onclick="appendtd('3')">3</button></td>
                </tr>
                <tr>
                    <td><button type="submit" class="bu1" id="four" onclick="appendtd('4')">4</button></td>
                    <td><button type="submit" class="bu1" id="five" onclick="appendtd('5')">5</button></td>
                    <td><button type="submit" class="bu1" id="six" onclick="appendtd('6')">6</button></td>
                </tr>
                <tr>
                    <td><button type="submit" class="bu1" id="seven" onclick="appendtd('7')">7</button></td>
                    <td><button type="submit" class="bu1" id="eight" onclick="appendtd('8')">8</button></td>
                    <td><button type="submit" class="bu1" id="nine" onclick="appendtd('9')">9</button></td>
                </tr>
            </table>
        </div>
        <table>
            <tr>
                <td><button type="submit" id="plus" class="pm" onclick="appendtd('+')">+</button></td>
                <td><button type="submit" id="minus" class="pm" onclick="appendtd('-')">-</button></td>
            </tr>
            <tr>
                <td><button type="submit" id="9esma" class="pm" onclick="appendtd('/')">/</button></td>
                <td><button type="submit" id="dharb" class="pm" onclick="appendtd('*')">*</button></td>
            </tr>
            <tr>
                <td colspan="2"><button onclick="calculate()" class="pm" id="equal" >=</button></td>
            </tr>
        </table>
        <button type="submit" id="ce" onclick="clear_dsiplay()">CE</button>
        <button type="submit" onclick="del()" id="del">del</button>
    </div>
</body>
<script src="script.js"></script>
</html>
